<svg xmlns="http://www.w3.org/2000/svg" width="860" height="34" viewBox="0 0 860 34" role="img" aria-label="work">
<style>
.p1 { animation: p1 2.8s cubic-bezier(.5,0,.75,0) infinite; }
.p2 { animation: p2 2.8s cubic-bezier(.5,0,.75,0) infinite; }
@keyframes p1 { from { transform: translateX(0); } to { transform: translateX(503.6px); } }
@keyframes p2 { from { transform: translateX(0); } to { transform: translateX(-503.6px); } }
.node { animation: node 2.8s ease-out infinite; }
@keyframes node { 0%, 88% { fill-opacity: .35; } 96% { fill-opacity: 1; } 100% { fill-opacity: .35; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rm-hide { display: none; } }
</style>
