<g clip-path="url(#cl)"><rect class="p1 rm-hide" x="-110" y="16" width="110" height="2" fill="url(#pl)"/></g>
<g clip-path="url(#cr)"><rect class="p2 rm-hide" x="860" y="16" width="110" height="2" fill="url(#pr)"/></g>
