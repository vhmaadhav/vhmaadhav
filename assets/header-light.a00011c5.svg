<style>
.in { animation: in .7s cubic-bezier(.2,.8,.2,1) both; }
.bar { transform-box: fill-box; transform-origin: left center; animation: grow .6s cubic-bezier(.2,.8,.2,1) .5s both; }
.wave { stroke-dasharray: 352.0 352.0; animation: wave 1.6s ease-out .3s both; }
.stair { stroke-dasharray: 453.1 453.1; animation: stair 2s cubic-bezier(.6,0,.3,1) 1.1s both; }
