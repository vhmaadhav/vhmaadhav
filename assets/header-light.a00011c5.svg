@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes wave { from { stroke-dashoffset: 352.0; } to { stroke-dashoffset: 0; } }
@keyframes stair { from { stroke-dashoffset: 453.1; } to { stroke-dashoffset: 0; } }
